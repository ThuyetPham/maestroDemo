appId: net.citigo.kiotviet.manager

name: Tạo hàng hóa thường

---
# - launchApp:
#     clearState: false

# Load dữ liệu hàng hóa
- runScript: ../../flows/data/Hang_hoa/Hang_hoa_thuong.js

# Điều hướng đến màn hình Hàng hóa (nếu chưa ở đó)
- tapOn:
    text: "Hàng hoá"
    index: 0
    optional: true

# Mở form tạo hàng hóa mới
- runFlow:
    file: ../../flows/keywords/Hang_hoa/form_hh_thuong.yaml
    env:
      code: ${output.hang_hoa_thuong_1.code}
      name: ${output.hang_hoa_thuong_1.name}
      category: ${output.hang_hoa_thuong_1.category}
      cost: ${output.hang_hoa_thuong_1.cost}
      price: ${output.hang_hoa_thuong_1.price}
      onhand: ${output.hang_hoa_thuong_1.onhand}

# Lưu hàng hóa
- tapOn: Lưu

# Chờ lưu thành công
- extendedWaitUntil:
    visible: "Hàng hoá"
    timeout: 10000

- assertNotVisible: "Thêm hàng hóa thành công"
- runFlow:
    file: ../../flows/keywords/Hang_hoa/xoa_hh.yaml
    env:
      name: ${output.hang_hoa_thuong_1.name}
